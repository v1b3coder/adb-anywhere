# Zapstore listing for ADB Anywhere: the app and release events that `zsp` signs
# and publishes. The APK itself comes from GitHub releases, and its icon from the
# APK. Media is uploaded to Blossom on publish.
repository: https://github.com/v1b3coder/adb-anywhere

name: ADB Anywhere
summary: Wireless ADB over a VPN without root, with advanced permission rules
description: |
  **Your phone's ADB, wherever the phone is.** Remote wireless debugging over a VPN,
  on mobile data, across network changes: stock Android, no root, no cable.

  It exists for one workflow. An editor or an agent builds, deploys and tests on the
  phone itself, and you are not tied to a laptop sitting next to it. Android's own
  wireless debugging gives up as soon as Wi-Fi does; this app keeps an endpoint that
  follows the phone instead.

  It also stays yours. Nothing has to answer a stranger: you name the machines that
  may connect, you can limit external ADB to the app you are working on, and a risky
  call such as an install can wait for your approval. One tap pauses everything, and
  the port closes itself once you stop using it.

  What it needs: a VPN that gives the phone a fixed address your computer can reach
  (Tailscale or WireGuard), and one Wi-Fi connection to pair. After a reboot it
  re-arms itself the next time Android's own ADB is reachable.

license: MIT
