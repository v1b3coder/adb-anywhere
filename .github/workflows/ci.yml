# Push/PR gate: unit tests, lint and the debug APK. A lint error fails the build.
# The APK carries the adbd binaries built for this commit, so the gate validates
# the same daemon the release ships; the adbd cache makes that a no-op unless the
# adbd subtree changed.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adbd:
    uses: ./.github/workflows/adbd.yml

  check:
    needs: adbd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            sdkmanager --install "platforms;android-36"
          fi

      - name: Fetch adbd binaries
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.adbd.outputs.artifact }}
          path: app/src/main/assets/adbd

      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PadbdSkipBuild=true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
