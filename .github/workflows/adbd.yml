# Builds the vendored adbd fork and publishes the per-ABI binaries as an
# artifact. A reusable workflow: ci.yml and release.yml both call it, so the gate and
# the release ship the same daemon. The cache keyed on the adbd tree hash decides
# whether it actually recompiles, which is a sharper filter than a path trigger.
name: adbd

on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding the per-ABI adbd binaries
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

env:
  # Pinned: the binaries are a cache key input, so the NDK must not float with
  # the runner image. This is the version the ubuntu-latest image ships.
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: adbd-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail loudly rather than silently building with a different compiler: the
      # cache key assumes this NDK produced these binaries.
      - name: Select Android NDK
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            echo "::error::NDK $ANDROID_NDK_VERSION is not installed on this runner image"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # The cache key covers the build inputs, not the whole subtree: a README
      # or licence edit must not trigger a recompile. A git tree hash is used
      # because hashFiles follows the broken symlinks the vendor trees carry.
      - name: Compute adbd cache key
        id: cachekey
        run: |
          set -euo pipefail
          tree=$(git rev-parse \
            HEAD:adbd/CMakeLists.txt HEAD:adbd/build.sh HEAD:adbd/patches \
            HEAD:adbd/src HEAD:adbd/stubs HEAD:adbd/tests HEAD:adbd/vendor \
            | sha256sum | cut -d' ' -f1)
          echo "key=adbd-${RUNNER_OS}-ndk${ANDROID_NDK_VERSION}-${tree}" >> "$GITHUB_OUTPUT"

      - name: Restore adbd binaries
        id: cache
        uses: actions/cache@v6
        with:
          path: adbd/build/out
          key: ${{ steps.cachekey.outputs.key }}

      - name: Build adbd
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./adbd/build.sh

      - name: Upload adbd binaries
        uses: actions/upload-artifact@v7
        with:
          name: adbd-${{ github.sha }}
          path: adbd/build/out
          if-no-files-found: error
