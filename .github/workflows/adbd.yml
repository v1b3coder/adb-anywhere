# Builds the vendored adbd fork. Runs only when the adbd subtree changes, and
# keeps the per-ABI binaries in a cache keyed on that subtree and the NDK, so the
# release build can reuse them instead of recompiling.
name: adbd

on:
  push:
    branches:
      - main
    paths:
      - 'adbd/**'
      - '.github/workflows/adbd.yml'
  pull_request:
    paths:
      - 'adbd/**'
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding the per-ABI adbd binaries
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

env:
  # Pinned: the binaries are a cache key input, so the NDK must not float with
  # the runner image. This is the version the ubuntu-latest image ships.
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: adbd-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail loudly rather than silently building with a different compiler: the
      # cache key assumes this NDK produced these binaries.
      - name: Select Android NDK
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            echo "::error::NDK $ANDROID_NDK_VERSION is not installed on this runner image"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # A git tree hash is the cache key: it covers exactly the committed
      # subtree and, unlike hashFiles, does not follow the broken symlinks that
      # the vendored trees carry.
      - name: Compute adbd cache key
        id: cachekey
        run: echo "key=adbd-${RUNNER_OS}-ndk${ANDROID_NDK_VERSION}-$(git rev-parse HEAD:adbd)" >> "$GITHUB_OUTPUT"

      - name: Restore adbd binaries
        id: cache
        uses: actions/cache@v6
        with:
          path: adbd/build/out
          key: ${{ steps.cachekey.outputs.key }}

      - name: Build adbd
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./adbd/build.sh

      - name: Upload adbd binaries
        uses: actions/upload-artifact@v7
        with:
          name: adbd-${{ github.sha }}
          path: adbd/build/out
          if-no-files-found: error
